<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 82" width="310" height="82" fill="none">
  <defs>
    <!-- Vibrant Blue Gradients matching logo -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="60%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#003d99" />
    </linearGradient>

    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047b3" />
      <stop offset="100%" stop-color="#002966" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="barGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <linearGradient id="homeTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="50%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0055d4" />
    </linearGradient>

    <linearGradient id="yourTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" />
      <stop offset="100%" stop-color="#08182b" />
    </linearGradient>
  </defs>

  <!-- ==================== LEFT ICON: HOUSE + BARS + ARROW ==================== -->
  <g transform="translate(4, 2)">
    <!-- Base Curve / Swoosh Ground -->
    <path d="M 6 72 Q 42 66, 78 72 Q 42 68.5, 6 72 Z" fill="url(#roofGrad)" opacity="0.95" />

    <!-- Chimney -->
    <path d="M 56 22 L 64 29 L 64 16 L 56 16 Z" fill="url(#roofGrad)" />

    <!-- House Roof -->
    <path d="M 12 40 L 42 12 L 72 40 L 66 44.5 L 42 22 L 18 44.5 Z" fill="url(#roofGrad)" />

    <!-- House Left Wall & Background Shadow Body -->
    <path d="M 19 41.5 L 19 70 L 25 70 L 25 47 L 42 31 L 65 52 L 65 70 L 71 70 L 71 41.5 L 42 15 Z" fill="url(#wallGrad)" opacity="0.3" />
    
    <!-- Left Main Wall Post -->
    <rect x="19" y="42" width="6.5" height="27" rx="0.5" fill="url(#roofGrad)" />

    <!-- 4-Pane Window -->
    <g fill="#0284c7" opacity="0.85">
      <rect x="38" y="27" width="3.5" height="3.5" rx="0.6" />
      <rect x="43" y="27" width="3.5" height="3.5" rx="0.6" />
      <rect x="38" y="32" width="3.5" height="3.5" rx="0.6" />
      <rect x="43" y="32" width="3.5" height="3.5" rx="0.6" />
    </g>

    <!-- 3 Growth Chart Bars -->
    <!-- Bar 1 (Left / Light Blue) -->
    <rect x="33" y="55" width="9" height="15" rx="1.2" fill="url(#barGrad1)" />
    <!-- Bar 2 (Middle) -->
    <rect x="44.5" y="47" width="9" height="23" rx="1.2" fill="url(#barGrad2)" />
    <!-- Bar 3 (Right / Deep Blue) -->
    <rect x="56" y="39" width="9" height="31" rx="1.2" fill="url(#barGrad3)" />

    <!-- Upward Growth Dynamic Swoosh & Arrowhead -->
    <path d="M 28 62 Q 44 59, 61 40" fill="none" stroke="url(#arrowGrad)" stroke-width="3" stroke-linecap="round" />
    <polygon points="56,38 66,35 63,45" fill="url(#arrowGrad)" />
  </g>

  <!-- ==================== VERTICAL DIVIDER ==================== -->
  <line x1="92" y1="12" x2="92" y2="70" stroke="#cbd5e1" stroke-width="1.6" stroke-linecap="round" />

  <!-- ==================== TYPOGRAPHY ==================== -->
  <g transform="translate(100, 0)">
    <!-- "Your" in deep navy font -->
    <text x="0" y="35" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="33" font-weight="800" fill="url(#yourTextGrad)" letter-spacing="-0.02em">Your</text>

    <!-- "Home" in bold bright electric blue -->
    <text x="0" y="66" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="url(#homeTextGrad)" letter-spacing="-0.03em">Home</text>

    <!-- Subtitle: "PLAN • ANALYZE • INVEST" -->
    <text x="1" y="77" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="7.5" font-weight="700" fill="#64748b" letter-spacing="3.2px">PLAN • ANALYZE • INVEST</text>
  </g>
</svg>
