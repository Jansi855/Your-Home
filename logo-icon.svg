<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90" fill="none">
  <defs>
    <linearGradient id="iconRoofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="60%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#003d99" />
    </linearGradient>

    <linearGradient id="iconWallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047b3" />
      <stop offset="100%" stop-color="#002966" />
    </linearGradient>

    <linearGradient id="iconBar1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="iconBar2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <linearGradient id="iconBar3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>

    <linearGradient id="iconArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Base Curve / Swoosh Ground -->
  <path d="M 8 78 Q 45 71, 82 78 Q 45 74, 8 78 Z" fill="url(#iconRoofGrad)" />

  <!-- Chimney -->
  <path d="M 59 26 L 68 34 L 68 18 L 59 18 Z" fill="url(#iconRoofGrad)" />

  <!-- House Roof -->
  <path d="M 14 45 L 45 15 L 76 45 L 70 50 L 45 26 L 20 50 Z" fill="url(#iconRoofGrad)" />

  <!-- House Shadow Body -->
  <path d="M 21 47 L 21 75 L 28 75 L 28 52 L 45 36 L 69 58 L 69 75 L 75 75 L 75 47 L 45 18 Z" fill="url(#iconWallGrad)" opacity="0.3" />
  
  <!-- Left Wall Post -->
  <rect x="21" y="47" width="7" height="28" rx="0.5" fill="url(#iconRoofGrad)" />

  <!-- 4-Pane Window -->
  <g fill="#0284c7" opacity="0.9">
    <rect x="41" y="31" width="3.8" height="3.8" rx="0.7" />
    <rect x="46.5" y="31" width="3.8" height="3.8" rx="0.7" />
    <rect x="41" y="36.5" width="3.8" height="3.8" rx="0.7" />
    <rect x="46.5" y="36.5" width="3.8" height="3.8" rx="0.7" />
  </g>

  <!-- 3 Growth Chart Bars -->
  <rect x="36" y="60" width="9.5" height="15" rx="1.5" fill="url(#iconBar1)" />
  <rect x="48" y="51" width="9.5" height="24" rx="1.5" fill="url(#iconBar2)" />
  <rect x="60" y="42" width="9.5" height="33" rx="1.5" fill="url(#iconBar3)" />

  <!-- Upward Growth Arrow -->
  <path d="M 31 67 Q 48 64, 66 44" fill="none" stroke="url(#iconArrow)" stroke-width="3.2" stroke-linecap="round" />
  <polygon points="60,42 71,39 68,50" fill="url(#iconArrow)" />
</svg>
